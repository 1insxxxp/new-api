name: Build deployment image

on:
  workflow_dispatch:
  push:
    branches:
      - codex/category-display-pricing

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Focused backend checks
        run: go test ./controller ./model -run 'Test.*(PublicGroup|Pricing)' -count=1
      - name: Frontend checks
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test --run src/features/pricing/lib/__tests__/group-display-pricing.test.ts src/features/pricing/lib/__tests__/price-symbol.test.ts src/features/pricing/components/__tests__/model-card-group-pricing.test.tsx src/features/pricing/components/__tests__/dynamic-pricing-symbol.test.tsx src/features/pricing/hooks/__tests__/use-pricing-data.test.tsx src/features/pricing/hooks/__tests__/group-order.test.tsx
      - uses: docker/setup-buildx-action@v3
      - name: Build and export immutable image
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          IMAGE="local/new-api:plaza-${SOURCE_COMMIT:0:9}"
          docker buildx build --platform linux/amd64 --load --label "org.opencontainers.image.revision=$SOURCE_COMMIT" --tag "$IMAGE" .
          mkdir -p image-artifact
          docker image inspect "$IMAGE" --format '{{.Id}}' > image-artifact/image-id.txt
          printf '%s\n' "$SOURCE_COMMIT" > image-artifact/commit.txt
          docker save "$IMAGE" | gzip -1 > image-artifact/new-api.tar.gz
          cd image-artifact
          sha256sum new-api.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: new-api-deployment-linux-amd64
          path: image-artifact/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
